const status=document.getElementById('status');function updateStatus(){const v=((yaw%(Math.PI*2))+Math.PI*2)%(Math.PI*2);const dir=Math.sin(yaw);status.textContent=Math.abs(dir)>.55?(dir>0?'تواجه اليسار A–B':'تواجه اليمين G–H'):(Math.cos(yaw)>0?'تواجه الجدار الأمامي C–F':'تواجه المدخل')}
function moveTo(x,z,yy=0){camera.position.set(x,1.62,z);yaw=yy;pitch=0;look();updateStatus()}
document.getElementById('entranceBtn').onclick=()=>moveTo(0,1.64,0);document.getElementById('leftBtn').onclick=()=>moveTo(-1.25,.65,Math.PI/2);document.getElementById('frontBtn').onclick=()=>moveTo(0,.60,0);document.getElementById('rightBtn').onclick=()=>moveTo(1.28,.45,-Math.PI/2);
const detailPanel=document.getElementById('panel');document.getElementById('close').onclick=()=>detailPanel.classList.remove('show');
const verified=JSON.parse(localStorage.getItem('warehouse_confirmed_v2')||'{}');
function save(){localStorage.setItem('warehouse_confirmed_v2',JSON.stringify(verified));}
function gotoShelf(slot){let L=slot[0];if('AB'.includes(L))moveTo(-1.28,L==='A'?.95:-.65,Math.PI/2);else if('GH'.includes(L))moveTo(1.28,L==='G'?-.65:.95,-Math.PI/2);else moveTo(-2.18+'CDEF'.indexOf(L)*1.45,.52,0);}
function showShelf(slot,subset){const ps=subset||byShelf[slot]||[];document.getElementById('panelTitle').textContent='الرف '+slot+' — '+ps.length+' أصناف';document.getElementById('panelText').textContent='اضغط على رقم القطعة لعرض موقعها وحالة الترتيب. جميع المواقع مقترحة حتى تعتمدها بنفسك.';let el=document.getElementById('results');el.innerHTML='';for(const p of ps){let b=document.createElement('div');b.textContent=p[0]+' — '+(p[1]||'الاسم يحتاج مطابقة');let sm=document.createElement('small');sm.textContent=verified[p[0]]?'✓ تم ترتيبه':'مقترح • '+p[2];b.appendChild(sm);b.onclick=()=>info({num:p[0],name:p[1],location:p[2],type:p[3]});el.appendChild(b)}detailPanel.classList.add('show')}
function info(p){document.getElementById('panelTitle').textContent='Spare Part '+p.num;const n=document.getElementById('panelText');n.innerHTML='';const para=document.createElement('p');para.textContent=(p.name||'اسم القطعة يحتاج مطابقة')+' | الموقع المقترح: '+p.location+' | التخزين: '+({tiny:'صندوق صغير جدًا',small:'صندوق صغير',heavy:'رف سفلي',cooling:'رف مباشر',large:'كرتون أو رف',long:'رف أو حامل طويل',hazard:'خارج رفوف المستودع',review:'يحتاج معاينة'}[p.type]||'كرتون أو رف');n.appendChild(para);let b=document.createElement('button');b.textContent=verified[p.num]?'✓ تم ترتيب القطعة — إلغاء التأكيد':'تأكيد ترتيب القطعة في موقعها';b.onclick=()=>{verified[p.num]=!verified[p.num];save();info(p)};n.appendChild(b);let go=document.createElement('button');go.textContent='اذهب إلى الرف';go.onclick=()=>{gotoShelf(p.location);detailPanel.classList.remove('show')};if(p.location!=='HAZARD')n.appendChild(go);document.getElementById('results').innerHTML='';detailPanel.classList.add('show')}
function searchPanel(){document.getElementById('panelTitle').textContent='بحث في '+catalog.length+' رقم قطعة';document.getElementById('panelText').innerHTML='<p>أدخل رقم Spare Part أو اسم القطعة المعروف. المواقع أولية وغير معتمدة.</p><input id="findInput" placeholder="110078" inputmode="search" />';const results=document.getElementById('results');results.innerHTML='';detailPanel.classList.add('show');const inp=document.getElementById('findInput');inp.addEventListener('input',()=>{const q=inp.value.toLowerCase().trim();results.innerHTML='';if(!q)return;for(const p of catalog.filter(p=>p[0].includes(q)||p[1].toLowerCase().includes(q)).slice(0,40)){let el=document.createElement('div');el.textContent=p[0]+' — '+(p[1]||'Spare Part');let sm=document.createElement('small');sm.textContent=(verified[p[0]]?'✓ تم ترتيبه':'مقترح')+' • '+p[2];el.appendChild(sm);el.onclick=()=>info({num:p[0],name:p[1],location:p[2],type:p[3]});results.appendChild(el)}});inp.focus()}
document.getElementById('searchBtn').onclick=searchPanel;
document.getElementById('help').onclick=()=>{document.getElementById('panelTitle').textContent='طريقة الاستخدام';document.getElementById('panelText').innerHTML='<p>اسحب بإصبعك يمينًا ويسارًا للالتفات، وأعلى وأسفل للنظر. توجد 270 قطعة في دليل البحث، وبعض ملصقات المجسمات تمثل مجموعة أصناف داخل نفس المستوى. استخدم الأسهم للمشي. اضغط على قطعة لعرض رقمها وموقعها. اختصارات A–B وC–F وG–H تنقلك بين الجدران.</p><p>هذا تصميم تجريبي مبني على تقدير 7 × 4 أمتار وترتيب الرفوف المقترح. الصور والأبعاد الحقيقية لم تتحول إلى مسح ثلاثي الأبعاد، لذلك تفاصيل المكان تقريبية.</p><p>يتطلب اتصالًا بالإنترنت لأول فتح لتحميل مكتبة العرض ثلاثي الأبعاد.</p>';document.getElementById('results').innerHTML='';detailPanel.classList.add('show')};
function drawMap(){const c=document.getElementById('map').getContext('2d'),w=312,h=206;c.clearRect(0,0,w,h);c.fillStyle='#152f42';c.fillRect(0,0,w,h);const X=x=>w/2+x*39,Z=z=>h/2+z*40;c.strokeStyle='#c5dee9';c.lineWidth=4;c.strokeRect(X(-3.5),Z(-2),273,160);c.fillStyle='#4a8cb7';for(let i=0;i<4;i++)c.fillRect(X(-2.65+i*1.45),Z(-1.85),49,13);c.fillStyle='#b93460';for(let z of [-.65,.9])c.fillRect(X(-3.35),Z(z-.5),12,42);c.fillStyle='#249777';for(let z of [-.65,.9])c.fillRect(X(3.05),Z(z-.5),12,42);c.fillStyle='#d15c51';c.fillRect(X(1.55),Z(1.5),80,12);c.fillStyle='#fff';c.font='bold 21px Arial';c.fillText('▲',X(camera.position.x)-8,Z(camera.position.z)+5);c.fillStyle='#9ce2ff';c.font='bold 14px Arial';c.fillText('C D E F',106,23);c.fillText('A B',3,103);c.fillText('G H',270,103)}
let last=performance.now();function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;let fb=(hold.forward?1:0)-(hold.back?1:0),lr=(hold.right?1:0)-(hold.left?1:0);if(fb||lr){let speed=1.4*dt;let xx=camera.position.x+(-Math.sin(yaw)*fb+Math.cos(yaw)*lr)*speed;let zz=camera.position.z+(-Math.cos(yaw)*fb-Math.sin(yaw)*lr)*speed;camera.position.x=Math.max(-2.74,Math.min(2.74,xx));camera.position.z=Math.max(-1.1,Math.min(1.64,zz));}updateStatus();drawMap();renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loading.remove();
</script></body></html>
